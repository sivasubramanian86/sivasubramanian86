name: Update Credly Badges
on:
  workflow_dispatch: # Allows manual triggers
  schedule:
    - cron: '0 0 1 * *' # Runs automatically once a month

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update Credly Badges
        run: python .github/scripts/update_credly_badges.py
        env:
          CREDLY_USER: siva-subramanian.a44c518c
          README_PATH: README.md

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes in Credly badges."
          else
            git commit -m "chore: update Credly certification thumbnails [skip ci]"
            git push
          fi

