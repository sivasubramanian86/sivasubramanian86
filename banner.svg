<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 215" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    
    <!-- Text / Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Role Gradient: Cyan to Blue -->
    <linearGradient id="roleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- GCP PCA Multi-color Gradient -->
    <linearGradient id="pcaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="50%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#34A853" />
    </linearGradient>

    <!-- GCP GAIL Green/Blue Gradient -->
    <linearGradient id="gcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#34A853" />
    </linearGradient>

    <!-- AWS Gradient -->
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="8" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="8" />

  <!-- Decorative Glowing Shapes -->
  <circle cx="880" cy="50" r="100" fill="#3B82F6" opacity="0.1" filter="blur(40px)" />
  <circle cx="50" cy="160" r="80" fill="#8B5CF6" opacity="0.1" filter="blur(30px)" />

  <!-- Accent bar -->
  <rect x="0" y="0" width="6" height="215" fill="url(#textGrad)" rx="3" />

  <!-- Name -->
  <text x="40" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="1">
    SIVASUBRAMANIAN
  </text>

  <!-- Core Title -->
  <text x="40" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="url(#textGrad)">
    Enterprise Cloud &amp; Test Architect | Compliance-First Agentic AI Leader
  </text>

  <!-- Badges / Affiliations (5 Pills) -->
  <!-- 1. Test Architect (Office Role) -->
  <g transform="translate(40, 145)">
    <rect width="145" height="28" rx="14" fill="#1e293b" stroke="url(#roleGrad)" stroke-width="1.5" />
    <text x="72.5" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">
      🧭 Test Architect
    </text>
  </g>

  <!-- 2. GCP Professional Cloud Architect -->
  <g transform="translate(199, 145)">
    <rect width="188" height="28" rx="14" fill="#1e293b" stroke="url(#pcaGrad)" stroke-width="1.5" />
    <text x="94" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">
      🏛️ GCP Cloud Architect
    </text>
  </g>

  <!-- 3. Google Cloud GAIL -->
  <g transform="translate(401, 145)">
    <rect width="168" height="28" rx="14" fill="#1e293b" stroke="url(#gcpGrad)" stroke-width="1.5" />
    <text x="84" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">
      🤖 Google Cloud GAIL
    </text>
  </g>

  <!-- 4. AWS Community Builder -->
  <g transform="translate(583, 145)">
    <rect width="188" height="28" rx="14" fill="#1e293b" stroke="url(#awsGrad)" stroke-width="1.5" />
    <text x="94" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">
      ☁️ AWS Community Builder
    </text>
  </g>

  <!-- 5. 18+ Years Experience -->
  <g transform="translate(785, 145)">
    <rect width="135" height="28" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="67.5" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">
      🏆 18+ Years Exp
    </text>
  </g>
</svg>
